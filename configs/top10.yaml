# Scheduled sweep: the top 10 models used on OpenRouter that Concentrate also serves.
# Source: openrouter.ai/rankings, week to Oct 13 2026 (tokens). Step 5 Preview (#2) isn't on Concentrate,
# so GPT-5.6 Luna (#7 by monthly tokens) replaces it; Nemotron 3 Ultra is tested on its paid version.
# `openrouter` is OpenRouter's model ID; `concentrate` is Concentrate's. If an OpenRouter ID is wrong,
# the sweep looks the model up by name in OpenRouter's catalog and logs what it used.
models:
  # Pilot week 1 (Nov 11-17, 2026): Concentrate's top 5 by usage, $20/day approved.
  - {name: DeepSeek V4.1 Flash,      openrouter: deepseek/deepseek-v4.1-flash,      concentrate: deepseek-v4-1-flash}
  - {name: Claude Opus 5.5,          openrouter: anthropic/claude-opus-5.5,         concentrate: claude-opus-5-5, runs_per_day: 1, modes: [same_provider], speed_only: true}   # once a day, speed only, to fit $20/day
  - {name: DeepSeek V4.1 Flash 1017, openrouter: deepseek/deepseek-v4.1-flash-1017, concentrate: deepseek-v4-1-flash-1017}   # OpenRouter ID unverified: check with gbench price-check
  - {name: GPT-6 Luna,               openrouter: openai/gpt-6-luna,                 concentrate: gpt-6-luna}
  - {name: GLM 5.3 Flash,            openrouter: z-ai/glm-5.3-flash,                concentrate: glm-5.3-flash}

# Two routing modes per model:
#   same_provider: OpenRouter is pinned to the provider Concentrate actually served (Concentrate has no pin
#                  option yet), so only the gateway differs.  -> gateway speed and fees
#   default:       no pins; each gateway routes as it would for a customer.  -> what customers actually get
modes: [same_provider, default]

# Window starts for `gbench schedule install` (your Mac's time zone). Each run starts at a random point
# within jitter_minutes of the window start (stratified random timing; methodology doc 3.9).
slots: {morning: "08:00", afternoon: "13:00", evening: "19:00"}
jitter_minutes: 150

speed:                       # every slot
  shapes: [tiny, short, medium]           # ~165, ~1.3k, ~10k input tokens (pilot; add `long` (~40k) for the standard plan)
  stream_modes: [true]
  requests_per_cell: 10      # x 4 sizes x 2 gateways per model and mode
  warmup: 5                  # discarded, as in the manual runs

volume:                      # small prompts, closed loop
  shape: tiny
  levels:
    - {requests: 100,   concurrency: 10}                    # every slot
    - {requests: 1000,  concurrency: 50, when: daily}       # once a day in the pilot (remove `when` for every slot)
    - {requests: 10000, concurrency: 200, when: weekly, max_price_per_m: 2.0}   # weekly; skips models over $2/1M blended

cache_probe: {prefix_tokens: 8000, when: daily}             # 4 identical prompts per gateway, once a day

quality: {sets: [gpqa_diamond], items: 198, when: weekly, modes: [same_provider], aa_control: true}
# aa_control: each week one model (rotating) answers GPQA twice per gateway, to measure the run-to-run noise floor

weekly: {day: rotate, slot: rotate}     # heavy tests rotate day and window each week (21 weeks cover all 21)
daily: {slot: rotate}                   # the cache test rotates through the three windows

budget_usd_per_slot: 14      # both gateways together; a normal slot is ~$1-3
budget_usd_weekly_slot: 36   # weekly slot adds 10,000-request volume and GPQA (Opus is speed-only)
budget_usd_per_gateway_daily: 20   # hard daily cap PER KEY: Concentrate <= $20/day and OpenRouter <= $20/day
# budget_usd_total: 140    # optional cap across the whole pilot (off: the daily per-key cap governs)
budget_start: 2026-11-11   # count total spend from this date (only used with budget_usd_total)
