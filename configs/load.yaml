# Load test: open-loop Poisson arrivals, so a slow system cannot hide queueing.
model_alias: small
shape: {input_tokens: 1000, output_tokens: 200}
stream: true
rates_rps: [1, 10, 50, 100, 250, 500]   # target arrival rates, one step each
step_duration_s: 600
slo_p99_ttft_ms: 2000                   # "max sustained RPS" = highest step with p99 TTFT under this
max_error_rate: 0.01
