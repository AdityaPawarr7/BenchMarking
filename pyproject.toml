[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gateway-bench"
version = "0.1.0"
description = "Benchmark Concentrate's router against other LLM gateways and routers on cost, speed, quality and reliability."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6",
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.1",
  "matplotlib>=3.8",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
data = ["datasets>=2.19"]
ui = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8"]

[project.scripts]
gbench = "gateway_bench.cli:main"

[tool.setuptools.packages.find]
include = ["gateway_bench*"]

[tool.setuptools.package-data]
"gateway_bench.ui" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
